# OneMix：前端 Nginx + 后端 FastAPI（Compose 编排）
# 前端在镜像内自动编译，无需手动 npm run build。直接执行：
#   docker compose up --build -d
# 浏览器访问：http://localhost:5173

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    environment:
      ONEMIX_DATA_DIR: /data/onemix
      HOME: /data
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
    volumes:
      - onemix_data:/data/onemix
      - onemix_cache:/data/.cache
    expose:
      - "8767"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    ports:
      - "${ONEMIX_WEB_PORT:-5173}:5173"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  onemix_data:
  onemix_cache:
